# Configuración común. Cada módulo completa SOLO su bloque comentado (RM-02).
# Las credenciales no se escriben acá: viven en .env (ver application-dev.yml).
spring:
  application:
    name: turnos
  jpa:
    open-in-view: false
    # El script schema-constraints.sql corre DESPUÉS de que Hibernate genera el esquema (DD-08).
    defer-datasource-initialization: true
    properties:
      hibernate:
        # Los instantes se persisten en UTC (timestamptz); la zona de negocio la da el Clock (DD-05).
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
      data-locations: classpath:schema-constraints.sql
      # Separador propio para que C-19 pueda agregar bloques DO $$ ... $$ sin cortarlos.
      separator: "^^^"
      continue-on-error: false
  # Correo transaccional: credenciales SOLO por entorno (.env no versionado). C-15.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# Springdoc apagado por defecto; application-dev.yml lo enciende.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${APP_COOKIE_SECURE:true}

# --- Bloques por módulo (descomentar y completar solo el propio) ---
app:
#   seguridad:        # dueño: C-03
#   configuracion:    # dueño: C-08
  notificaciones:   # dueño: C-15 (mail)
    canal: ${NOTIFICACIONES_CANAL:smtp}
    remitente: ${SMTP_FROM:turnos@consultorio.test}
    planificador:
      habilitado: true
      intervalo: 5m
    reintento:
      maximo-intentos: 3
      espera-inicial: 5m
      multiplicador: 2
  ratelimit:        # dueño: C-17
    max-solicitudes-por-ip: 60
    ventana-ip: 1m
    max-solicitudes-por-clave: 10
    ventana-clave: 1m
#   reservapublica:   # dueños: C-14 y C-36
  listaespera:      # dueño: C-36 (oferta de hueco)
    url-publica: ${APP_PUBLIC_URL:http://localhost:5173}
    avisos:
      sincronico: false
    ofertas:
      vencimiento:
        habilitado: true
        intervalo: 1m
#   agenda:           # dueño: por asignar (agenda)
