# Perfil de pruebas: esquema limpio en cada ejecución. El datasource lo aporta @ServiceConnection (Testcontainers).
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop

# C-18: el vencimiento de la lista de espera no corre solo en las pruebas; se invoca con un reloj fijo.
lista-espera:
  vencimiento:
    cron: "-"
# Correo (C-15): adaptador en memoria y planificador apagado; la suite nunca abre SMTP ni dispara tareas.
app:
  notificaciones:
    canal: memoria
    planificador:
      habilitado: false
  # C-36: aviso de huecos sincrónico (determinista) y vencimiento de ofertas invocado a mano con reloj fijo.
  listaespera:
    url-publica: https://turnos.consultorio.test
    avisos:
      sincronico: true
    ofertas:
      vencimiento:
        habilitado: false
