# Perfil de pruebas: esquema limpio en cada ejecución. El datasource lo aporta @ServiceConnection (Testcontainers).
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
# Correo: adaptador en memoria y planificador apagado; la suite nunca abre SMTP ni dispara tareas.
app:
  notificaciones:
    canal: memoria
    planificador:
      habilitado: false
